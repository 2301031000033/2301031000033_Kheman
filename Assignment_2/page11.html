<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Support</title>
    <style>
        body {

        .feedback button {

            padding: 10px 20px;

            cursor: pointer;
            border-radius: 5px;
        }

</head>
