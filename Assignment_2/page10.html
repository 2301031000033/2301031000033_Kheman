<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>
    <style>
        body {
            background: linear-gradient(to bottom, #57a2ff, #c2a2ff);
            text-align: center;
            font-family: Arial, sans-serif;
            color: white;
        }
        .logo {
            width: 150px;
            margin-top: 20px;
        }
        .container {
            margin-top: 20px;
        }
        h1, h2 {
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }
        .button {
            display: block;
            width: 80%;
            max-width: 300px;
            margin: 15px auto;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .btn-blue {
            background: #afffff;
            color: black;
        }
        .btn-gradient {
            background: linear-gradient(to right, #ff7eb3, #ffa76d);
            color: black;
        }
        .btn-orange {
            background: orange;
            color: black;
        }
    </style>
</head>
<body>
    <img src="image10.png" alt="AI Recipes Logo" class="logo">
    <div class="container">
        <h1>User Dashboard</h1>
        <h2>Welcome [user-name]</h2>
        <a href="page3.html" class="button btn-blue">Try-new recipe</a>
        <a href="page3.html" class="button btn-blue">Your schedule</a>
        <a href="page11.html" class="button btn-blue">Help</a>
        <a href="page11.html" class="button btn-orange">Profile</a>
    </div>
</body>
</html>
