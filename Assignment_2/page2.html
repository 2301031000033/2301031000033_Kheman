<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chef Signup</title>
    <style>
        body {
            background: linear-gradient(to bottom, #57a2ff, #c2a2ff);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .container {
            background: #6d7cb3;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 500px;
            color: white;
        }
        h2 {
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }
        input {
            width: 80%;
            padding: 8px;
            margin: 10px 0;
            border: none;
            border-bottom: 2px solid white;
            background: transparent;
            color: white;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-bottom: 2px solid #ffcc00;
        }
        button {
            background: #37474f;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-top: 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #263238;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Welcome to AI-Chef</h2>
        <input type="text" placeholder="Username">
        <input type="email" placeholder="Email-id">
        <input type="password" placeholder="Password">
        <input type="password" placeholder="Confirm password">
        <button onclick="location.href='page1.html'">register</button>
    </div>
</body>
</html>
